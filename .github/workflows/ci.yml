name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A new edition every hour: the job below rebuilds edition.json first.
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Never fails the deploy: without Hacker News it keeps the live edition,
      # and without that the app loads stories live, as it always could.
      - name: Build the edition
        if: github.event_name != 'pull_request'
        run: node --experimental-strip-types scripts/build-edition.ts static/edition.json
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
