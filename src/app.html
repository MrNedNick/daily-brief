<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Today's edition of Hacker News: the biggest stories of the last 24 hours, a story from this day in HN history, sections, topics and saved stories that open offline." />
		<!-- Both APIs are hit on first paint; opening the connections early saves a round trip each. -->
		<link rel="preconnect" href="https://hn.algolia.com" crossorigin />
		<link rel="preconnect" href="https://hacker-news.firebaseio.com" crossorigin />
		<script>
			// Applied before first paint so a light-theme reader never sees a
			// dark flash. Kept tiny and inline on purpose.
			try {
				const stored = JSON.parse(localStorage.getItem('daily-brief:prefs') || '{}');
				const theme =
					stored.theme ||
					(window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
